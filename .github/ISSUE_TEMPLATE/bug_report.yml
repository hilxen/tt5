name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open channel ...
        2. Tap ...
        3. ...
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Shown at the top of the Help screen
      placeholder: "1.7.0"
    validations:
      required: true
  - type: input
    id: ios
    attributes:
      label: iOS version and device
      placeholder: "iOS 27.0, iPhone 13"
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Where did you get the app?
      options:
        - App Store
        - Built from source
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, the channel language, Bluetooth speaker or earpiece, log output.
